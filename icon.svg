<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#0c0a09"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Shield -->
  <path d="M256 70 L400 130 C400 130 415 300 256 420 C97 300 112 130 112 130 Z" fill="url(#shield)" opacity="0.85"/>
  <path d="M256 90 L385 144 C385 144 398 290 256 398 C114 290 127 144 127 144 Z" fill="none" stroke="#4ade80" stroke-width="3"/>
  <!-- Bug/virus icon (crossed out) -->
  <!-- Bug body -->
  <ellipse cx="256" cy="250" rx="35" ry="45" fill="#1c1917" stroke="#bbf7d0" stroke-width="3"/>
  <!-- Bug head -->
  <circle cx="256" cy="195" r="18" fill="#1c1917" stroke="#bbf7d0" stroke-width="3"/>
  <!-- Bug legs -->
  <line x1="221" y1="225" x2="195" y2="210" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="221" y1="250" x2="192" y2="250" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="221" y1="275" x2="195" y2="290" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="291" y1="225" x2="317" y2="210" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="291" y1="250" x2="320" y2="250" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="291" y1="275" x2="317" y2="290" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <!-- Bug antennae -->
  <line x1="244" y1="180" x2="232" y2="160" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="180" x2="280" y2="160" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round"/>
  <!-- Red cross-out slash -->
  <line x1="190" y1="160" x2="322" y2="330" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="160" x2="322" y2="330" stroke="#fca5a5" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkmark at bottom -->
  <polyline points="230,350 250,370 290,330" fill="none" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
